<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen">

  <div class="flex">
    <!-- Sidebar -->
    <div class="w-64 bg-gray-800 h-screen p-6">
      <h1 class="text-2xl font-bold mb-8">📊 Dashboard</h1>
      <nav class="space-y-2">
        <a href="#" class="block py-2 px-4 rounded bg-blue-600">Overview</a>
        <a href="#" class="block py-2 px-4 rounded hover:bg-gray-700">Reports</a>
        <a href="#" class="block py-2 px-4 rounded hover:bg-gray-700">Settings</a>
      </nav>
    </div>

    <!-- Main content -->
    <div class="flex-1 p-8">
      <h2 class="text-3xl font-bold mb-6">Overview</h2>

      <!-- Cards -->
      <div class="grid grid-cols-3 gap-6 mb-8">
        <div class="bg-gray-800 p-6 rounded-lg shadow">
          <p class="text-gray-400 text-sm">Total Sales</p>
          <p class="text-3xl font-bold mt-2">₹1,24,000</p>
        </div>
        <div class="bg-gray-800 p-6 rounded-lg shadow">
          <p class="text-gray-400 text-sm">Active Users</p>
          <p class="text-3xl font-bold mt-2">3,240</p>
        </div>
        <div class="bg-gray-800 p-6 rounded-lg shadow">
          <p class="text-gray-400 text-sm">Growth</p>
          <p class="text-3xl font-bold mt-2 text-green-400">+18%</p>
        </div>
      </div>

      <!-- Chart -->
      <div class="bg-gray-800 p-6 rounded-lg shadow">
        <h3 class="text-lg font-semibold mb-4">Monthly Revenue</h3>
        <canvas id="myChart"></canvas>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
