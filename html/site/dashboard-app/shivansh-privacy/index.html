<!DOCTYPE html>
<html lang="en">
  <head>
<meta charset="UTF-8">
<title>Count ur Mon9e</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
</head>
<head>
<meta charset="UTF-8">
<title>Count ur Mon9e</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app" id="mainApp">
  <aside class="sidebar">
    <div class="logo-row">
      <div class="logo-badge">
        <span class="eagle">🦅</span>
        <span class="ball"></span>
      </div>
      <div class="logo-text"><h1>Count ur <span>Mon9e</span></h1></div>
      <div class="menu-wrap">
        <button class="dots-btn" onclick="toggleMenu()">⋮</button>
        <div class="dropdown" id="dropdownMenu">
          <button onclick="linkGoogle()">Link Google ID</button>
          <button onclick="linkMobile()">Link Mobile Number</button>
          <button onclick="logout()">Logout</button>
        </div>
      </div>
    </div>

    <div class="account-info" id="accountInfo"></div>

    <div class="clock-widget">
      <p class="clock-label">Indian Standard Time</p>
      <p class="clock-time" id="clock">--:--:--</p>
      <p class="clock-date" id="clockDate">--</p>
    </div>

    <div class="calendar-widget">
      <div class="cal-header"><span id="calMonthYear"></span></div>
      <div class="cal-grid" id="calGrid"></div>
    </div>

    <nav class="side-nav">
      <button class="nav-btn active" id="navOverview" onclick="showOverview()">Overview</button>
      <button class="nav-btn" id="navData" onclick="openDataPage()">Data Collection</button>
    </nav>
  </aside>

  <main class="main" id="mainContent">
    <section class="top-cards">
      <div class="card balance-card">
        <p class="card-label">Account Balance</p>
        <h2 id="balanceDisplay">₹0</h2>
        <input type="number" id="balanceInput" placeholder="Set balance">
        <button onclick="setBalance()">Update</button>
      </div>

      <div class="card budget-card">
        <p class="card-label">Monthly Budget</p>
        <input type="number" id="budgetInput" placeholder="Enter budget">
        <button onclick="setBudget()">Set Budget</button>
        <div class="budget-bar"><div class="budget-fill" id="budgetFill"></div></div>
        <p id="budgetText">Spent ₹0 of ₹0</p>
      </div>
    </section>

    <section class="expense-section">
      <h3>Add Expense</h3>
      <form id="expenseForm" class="expense-form">
        <input type="text" id="itemName" placeholder="Item name" required>
        <select id="category">
          <option>Food</option>
          <option>Travel</option>
          <option>Shopping</option>
          <option>Bills</option>
          <option>Other</option>
        </select>
        <input type="number" id="itemAmount" placeholder="Amount ₹" required>
        <button type="submit">Add</button>
      </form>

      <table class="expense-table">
        <thead><tr><th>Date</th><th>Item</th><th>Category</th><th>Amount</th><th></th></tr></thead>
        <tbody id="expenseBody"></tbody>
      </table>
    </section>
  </main>
</div>

<div class="data-page" id="dataPage">
  <header class="data-header">
    <div class="logo-badge small">
      <span class="eagle">🦅</span>
      <span class="ball"></span>
    </div>
    <h2>Data <span>Collection</span></h2>
    <button class="back-btn" onclick="closeDataPage()">← Back to Dashboard</button>
  </header>

  <div class="data-tabs">
    <button class="tab-btn active" id="tabNotesBtn" onclick="showTab('notes')">Notes</button>
    <button class="tab-btn" id="tabHistoryBtn" onclick="showTab('history')">History</button>
  </div>

  <section id="notesTab" class="tab-panel">
    <p class="section-label">Select Month</p>
    <div class="month-grid" id="monthGrid"></div>

    <textarea id="noteText" placeholder="Write your notes about this month's expenses..."></textarea>
    <button class="save-btn" onclick="saveNote()">Save Note</button>

    <h3 class="sub-heading">Saved Notes</h3>
    <div id="notesHistory" class="notes-history"></div>
  </section>

  <section id="historyTab" class="tab-panel" style="display:none;">
    <h3 class="sub-heading">Expense Activity History</h3>
    <div id="activityHistory" class="activity-history"></div>
  </section>
</div>
<script src="guard.js"></script>
<script src="script.js"></script>
</body>
</html>
