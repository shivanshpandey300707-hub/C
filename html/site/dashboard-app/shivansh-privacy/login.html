<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login — Count ur Mon9e</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

<div class="login-box">
  <div class="logo-badge">
    <span class="eagle">🦅</span>
    <span class="ball"></span>
  </div>
  <h1>Shivansh <span>Privacy</span></h1>
  <p class="login-sub">Secure personal expense tracker</p>

  <div class="login-tabs">
    <button class="tab-btn active" id="loginTabBtn" onclick="switchTab('login')">Login</button>
    <button class="tab-btn" id="signupTabBtn" onclick="switchTab('signup')">Sign Up</button>
  </div>

  <form id="loginForm" class="login-form">
    <input type="email" id="loginEmail" placeholder="Email" required>
    <input type="password" id="loginPassword" placeholder="Password" required>
    <button type="submit" class="save-btn">Login</button>
    <p class="error-text" id="loginError"></p>
  </form>

  <form id="signupForm" class="login-form" style="display:none;">
    <input type="email" id="signupEmail" placeholder="Email" required>
    <input type="password" id="signupPassword" placeholder="Password (min 6 characters)" required>
    <button type="submit" class="save-btn">Create Account</button>
    <p class="error-text" id="signupError"></p>
  </form>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="auth.js"></script>
</body>
</html>
